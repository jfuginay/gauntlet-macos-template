<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient definitions for retro-futuristic look -->
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#00ffff" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39ff14" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    
    <!-- Glow filter for neon effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Terminal scanlines effect -->
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="512" height="4">
      <rect width="512" height="2" fill="transparent"/>
      <rect y="2" width="512" height="2" fill="rgba(0,255,255,0.03)"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="80" ry="80" fill="url(#backgroundGradient)" />
  
  <!-- Scanlines overlay for terminal effect -->
  <rect width="512" height="512" rx="80" ry="80" fill="url(#scanlines)" opacity="0.3" />
  
  <!-- Terminal-style border -->
  <rect x="20" y="20" width="472" height="472" rx="60" ry="60" fill="none" 
        stroke="url(#primaryGradient)" stroke-width="2" opacity="0.5" />
  
  <!-- Main ENGIE text -->
  <text x="256" y="200" font-family="monospace" font-size="84" font-weight="bold" 
        text-anchor="middle" fill="url(#primaryGradient)" filter="url(#glow)">
    ENGIE
  </text>
  
  <!-- Subtitle -->
  <text x="256" y="240" font-family="monospace" font-size="18" 
        text-anchor="middle" fill="#64748b">
    Expert Navigator for Goal Implementation
  </text>
  
  <!-- Terminal cursor symbol -->
  <rect x="440" y="210" width="12" height="20" fill="url(#accentGradient)" 
        filter="url(#glow)">
    <animate attributeName="opacity" values="1;0;1" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Circuit-like design elements -->
  <g stroke="url(#primaryGradient)" stroke-width="2" fill="none" opacity="0.6">
    <!-- Top circuit lines -->
    <path d="M80 120 L120 120 L140 100 L180 100" />
    <path d="M320 100 L360 100 L380 120 L420 120" />
    <circle cx="140" cy="100" r="4" fill="url(#accentGradient)" />
    <circle cx="360" cy="100" r="4" fill="url(#accentGradient)" />
    
    <!-- Bottom circuit lines -->
    <path d="M80 380 L120 380 L140 400 L180 400" />
    <path d="M320 400 L360 400 L380 380 L420 380" />
    <circle cx="140" cy="400" r="4" fill="url(#accentGradient)" />
    <circle cx="360" cy="400" r="4" fill="url(#accentGradient)" />
  </g>
  
  <!-- AI/Brain icon in top-left corner -->
  <g transform="translate(60, 60)">
    <circle cx="20" cy="20" r="15" fill="none" stroke="url(#accentGradient)" stroke-width="2" opacity="0.8" />
    <path d="M10 20 Q20 10 30 20 Q20 30 10 20" fill="url(#accentGradient)" opacity="0.6" />
    <circle cx="15" cy="18" r="2" fill="url(#primaryGradient)" />
    <circle cx="25" cy="18" r="2" fill="url(#primaryGradient)" />
  </g>
  
  <!-- Terminal icon in bottom-right corner -->
  <g transform="translate(430, 430)">
    <rect x="5" y="10" width="30" height="20" rx="3" fill="none" 
          stroke="url(#accentGradient)" stroke-width="2" opacity="0.8" />
    <path d="M10 18 L15 22 L10 26" stroke="url(#primaryGradient)" stroke-width="2" 
          fill="none" stroke-linecap="round" />
    <line x1="18" y1="26" x2="25" y2="26" stroke="url(#primaryGradient)" 
          stroke-width="2" stroke-linecap="round" />
  </g>
  
  <!-- Energy/power lines emanating from center -->
  <g stroke="url(#accentGradient)" stroke-width="1" opacity="0.3">
    <path d="M256 280 Q300 320 380 340" fill="none" />
    <path d="M256 280 Q200 320 120 340" fill="none" />
    <path d="M256 280 Q320 300 400 280" fill="none" />
    <path d="M256 280 Q180 300 100 280" fill="none" />
  </g>
</svg> 